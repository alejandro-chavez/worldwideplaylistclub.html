<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos</title>
<style>
  body { margin: 0; }
  h1,h2{margin:5px auto; display:block; text-align: center;}
  .image-stack { display: flex; flex-direction: column; height: 60vh; height: 60dvh; }
  img { display: block; flex: 1; min-height: 0; margin: auto; width: auto; aspect-ratio: 2.2 / 1; object-fit: cover; }
  button { display: block; margin: 10px auto; padding: 10px 20px; font-size: 16px; }

  @media (max-width: 600px) {
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1rem; }
    .image-stack { height: 70vh; height: 70dvh; }
    img { width: 100%; aspect-ratio: 1.6 / 1; }
    button { width: calc(100% - 40px); padding: 14px 20px; font-size: 18px; }
  }

  @media (min-width: 601px) and (max-width: 1200px) {
    h1 { font-size: 2rem; }
    .image-stack { height: 65vh; height: 65dvh; }
    img { max-width: 90vw; aspect-ratio: 2 / 1; }
  }
</style>
</head>
<body>
  <h1>Exquisite Corpse</h1>
  <h2>by: us!</h2>
  <div class="image-stack">
    <img id="head" alt="">
    <img id="torso" alt="">
    <img id="legs" alt="">
  </div>
  <button onclick="randomize()">Randomize</button>

  <script>
    const counts = { head: 6, torso: 4, legs: 9 };

    function randomize() {
      for (const part in counts) {
        const n = Math.floor(Math.random() * counts[part]);
        document.getElementById(part).src = part + "_" + n + ".jpeg";
      }
    }

    randomize();
  </script>
</body>
</html>
